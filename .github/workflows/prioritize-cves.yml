name: Prioritized CVE gate

# Trivy tells us which CVEs are in the shipped dependency tree. The CVE
# Prioritizer tells us which of them are worth acting on today, by combining
# CVSS with EPSS (probability of exploitation) and CISA KEV (known exploited).
#
# Severity alone over-reports: a CRITICAL with a 0.02% exploit probability and
# no KEV listing is not a reason to block a PR, while a MEDIUM that is being
# actively exploited is. This job gates on that judgement, not on severity.
#
# Action versions here match cw-company-and-config-info, the closest sibling
# Forge app, rather than the newest available majors.
on:
  pull_request:
  schedule:
    - cron: '0 18 * * 1-5' # weekday mornings NZT
  workflow_dispatch:

concurrency:
  group: cve-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # This repo is two independent npm projects with separate lockfiles: the
      # Forge backend at the root, and the JSM queue UI under static/queue that
      # Vite bundles into static/queue/dist. Both ship. Scanning only the root
      # would miss the frontend entirely — measured at 97 production components
      # including react and @forge/bridge.
      - name: Install dependencies (backend and queue UI)
        run: |
          npm ci
          npm ci --prefix static/queue

      # --omit=dev throughout: Forge bundles production dependencies only, so a
      # CVE in eslint or vitest must never block a merge.
      - name: Generate SBOMs (production dependencies only)
        run: |
          mkdir -p cve-scan
          npm sbom --sbom-format cyclonedx --omit=dev > cve-scan/sbom-backend.json
          npm sbom --sbom-format cyclonedx --omit=dev --prefix static/queue \
            > cve-scan/sbom-queue.json

      # exit-code 0 on both scans is deliberate: Trivy is the inventory here,
      # not the gate. Failing on its severity would defeat the point of
      # prioritizing. ignore-unfixed is deliberately NOT set — a KEV-listed CVE
      # with no patch available is exactly what we want surfaced.
      - name: Scan the backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'cve-scan/sbom-backend.json'
          format: 'json'
          output: 'cve-scan/trivy-backend.json'
          exit-code: '0'

      - name: Scan the queue UI SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'cve-scan/sbom-queue.json'
          format: 'json'
          output: 'cve-scan/trivy-queue.json'
          exit-code: '0'

      # Trivy reports GHSA and CVE identifiers; the prioritizer only understands
      # CVEs, so anything else is dropped here — a green gate is not the same as
      # "no known advisories". The count is surfaced so the skip below is
      # explicit rather than silent.
      - name: Extract unique CVE IDs from both scans
        id: extract
        run: |
          set -euo pipefail
          for f in cve-scan/trivy-backend.json cve-scan/trivy-queue.json; do
            if ! jq -e 'has("Results")' "$f" > /dev/null 2>&1; then
              echo "::error::$f is missing or malformed; refusing to treat that as a clean tree."
              exit 1
            fi
          done
          # grep exits 1 when nothing matches, which is a legitimate clean
          # result under `set -e`, so it is tolerated here and only here.
          jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' \
            cve-scan/trivy-backend.json cve-scan/trivy-queue.json \
            | { grep -E '^CVE-' || true; } | sort -u > cve-scan/cves.txt
          count=$(wc -l < cve-scan/cves.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count unique CVE IDs across the backend and queue UI."

      # NIST_API_KEY is strongly recommended, not optional at this tree size.
      # NVD rate-limits to 5 requests per 30s without one, and the action
      # refuses to gate on a partially-scored run rather than reporting a
      # rate-limited result as clean. Until the secret exists this job would
      # fail on that guard, so allow-partial keeps it advisory — flip it to
      # false once a key is in place.
      - name: Prioritize CVEs
        id: prio
        if: steps.extract.outputs.count != '0'
        uses: Confluenceservice/cve-prioritizer-action@v1
        with:
          cve-file: cve-scan/cves.txt
          output-file: cve-scan/cve-priorities.csv
          fail-on: P1 # blocks the merge on P1 and P1+ only
          allow-partial: true
          nist-api-key: ${{ secrets.NIST_API_KEY }}

      - name: Report a clean tree
        if: steps.extract.outputs.count == '0'
        run: |
          echo "### CVE Prioritizer results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No CVEs in the production dependency tree. Nothing to prioritize." \
            >> "$GITHUB_STEP_SUMMARY"

      # Runs even when the gate failed — the results are most useful precisely
      # when the job went red.
      - name: Upload scan results
        if: always() && steps.extract.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cve-priorities
          path: cve-scan/
          if-no-files-found: warn
